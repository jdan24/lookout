[project]
name = "lookout"
version = "0.1.0"
description = "Read-only verification of Trading Technologies (TT) trading setups"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "platformdirs>=4",
    "pydantic>=2.7",
    "streamlit>=1.40",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Lookout ships as plain .py files run in place; it is not built or installed.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S110", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
