[project]
name = "lookout"
version = "0.1.0"
description = "Read-only verification of Trading Technologies (TT) trading setups"
readme = "README.md"
requires-python = ">=3.12"
# Lookout ships as plain .py files run in place; it is not built or installed.
# The packages it needs are listed in requirements.txt (requirements-dev.txt for
# development). The launcher checks them; nothing is installed automatically.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S110", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
