# Example client profile for Setup Verification.
#
# Every name, id and value in this file is invented; it matches the synthetic test
# fixture (tests/fixtures/synthetic.py). Copy it, rename it to <client>.toml and fill
# in your own values. Real profiles hold client data: keep them OUT of the repo, in
#     %LOCALAPPDATA%\Lookout\clients\        (or [clients] directory in config.toml)
#
# How levels work
#   Each [[trees]] entry is one hierarchy the client lives in. `path` walks from a
#   top-level account down to the client's start account (depth 0). Every account
#   below it gets the [[trees.levels]] entry for its depth. Several entries may share
#   a depth: the first one that fits (account_type / match_regex) wins. An account
#   that fits no entry is shown amber and no other rule checks it. Accounts deeper
#   than the deepest level use the deepest level's rules and show as "Sub-account".
#
# Values: apply_limits / apply_restrictions = "on" | "off" | "any" (not checked)
#
# Users: `required_users` on a tree lists the TT user ids every lowest-level account
#   must have. A user counts when assigned on the account itself or on any account
#   above it (up to the start account); where it is assigned is not checked.

client = "example"            # snapshot folder name: letters, digits, - _ .
label = "Example client"
# Order Tag Default fields shown on the "Checked by hand" tab (name contains the text).
display_only_fields = ["Operator", "Authorized Trader"]

# ---------------------------------------------------------------------------------
[[trees]]
name = "north"
label = "North company"
path = ["NORTHCO", "BROKER", "FUND"]   # top-level account ... start account
start_id = "100"                    # optional; checked against the name
id_verified = true                  # false: an id mismatch is only a note
# Markets allowed in limit rows in this tree (market id = exchange name).
markets = { "7" = "CME", "2" = "Eurex", "30" = "Euronext", "107" = "HKEX", "91" = "MX" }
# Users every trading account must have, assigned on it or inherited from above.
required_users = ["9001", "9002", "9003"]

  [[trees.levels]]
  depth = 0
  label = "Client group"

  [[trees.levels]]
  depth = 1
  label = "Team"
  account_type = 3                  # Non-Routing; anything else here does not fit
  name_regex = "^FUND-.+$"           # naming rule: red when the name does not match
  name_hint = "FUND-<TEAM>"
  apply_limits = "on"
  limit_rows_required = true
  apply_restrictions = "on"
  may_be_empty = true               # a new team with nothing below it is amber, not red

  [[trees.levels]]
  depth = 2
  label = "Trading account"
  name_regex = "^[A-Z]{3}[0-9]{5}[A-Z]{2}$"
  name_hint = "<account number><2-letter team code>"
  apply_limits = "off"
  apply_restrictions = "off"

  # Expected Order Tag Default ("Exchanges" tab) values. A market is only checked for
  # an account when the level that holds its limits (limit_rows_required = true, here
  # the Team) has a limit on that market; otherwise the row is grey, "not checked".
  [[trees.order_tag_defaults]]
  label = "Clearing Account"
  level = "Trading account"
  field_id = "1859"
  markets = ["7", "2", "30", "107", "91"]
  value_from_name = '^(?P<base>.*\d)[A-Za-z]+$'   # the name minus its letter suffix
  set_on = "self"                   # must be on the account itself, not inherited
  except_names = "IX$"

  [[trees.order_tag_defaults]]
  label = "Exchange Account"
  level = "Trading account"
  fields = { "30" = "25", "107" = "26" }   # market id = field id
  value = "ACCTSTD"
  set_on = "inherited_ok"
  except_names = "IX$"

  [[trees.order_tag_defaults]]
  label = "Clearing Firm ID"
  level = "Trading account"
  fields = { "30" = "27", "107" = "28" }
  value = "77777"
  except_names = "IX$"

  [[trees.order_tag_defaults]]
  label = "Exchange Account"
  level = "Trading account"
  fields = { "30" = "25" }
  value = "ACCTIDX"
  only_names = "IX$"

  [[trees.order_tag_defaults]]
  label = "Clearing Firm ID"
  level = "Trading account"
  fields = { "30" = "27" }
  value = "77777"
  only_names = "IX$"

# ---------------------------------------------------------------------------------
[[trees]]
name = "south"
label = "South company"
path = ["SOUTHCO", "S-FUND"]
start_id = "500"
markets = { "24" = "ASX", "155" = "JPX", "66" = "MEFF" }
required_users = ["9001"]

  [[trees.levels]]
  depth = 0
  label = "Client group"
  apply_restrictions = "on"

  [[trees.levels]]
  depth = 1
  label = "Team"
  account_type = 3
  name_regex = "^S-FUND-.+$"
  name_hint = "S-FUND-<TEAM>"
  apply_limits = "on"
  limit_rows_required = true
  apply_restrictions = "off"
  may_be_empty = true

  [[trees.levels]]
  depth = 2
  label = "Trading account"
  name_regex = "^S-[A-Z]{3}[0-9]{5}[A-Z]{2}$"
  name_hint = "S-<account number><2-letter team code>"
  apply_limits = "off"
  apply_restrictions = "off"

# ---------------------------------------------------------------------------------
# Optional rules. Leave a section out to switch the rule off.

# A team with a limit on one of these products needs an account whose name ends in
# `suffix` below it; such an account under a team without the limit is flagged.
[rules.companion_account]
label = "Index account"
level = "Team"
market = "30"
products = ["jFCE", "iFIB", "lPSI", "bBEL"]
suffix = "IX"
unnecessary = "amber"             # amber | red

# Groups with the client's naming that sit outside the start accounts.
[rules.legacy_groups]
name_regex = "^(S-)?FUND-"
